<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xzfseofviwlifygfkhdp.supabase.co https://*.supabase.co;">
    <title>HS Scheduler - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Prevents unauthorized users from seeing a 'flash' of content */
        body { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="app-section">
        <div class="header-flex">
            <h1>Welcome, <span id="user-name">...</span> 👋</h1>
            <button id="logout-btn">Sign Out</button>
        </div>
        
        <div class="card highlight">
            <h2 style="color: var(--primary);">Master Grid Visualizer</h2>
            <p style="color: var(--text-muted);">Ready to build? Move to the visual drag-and-drop board.</p>
            <div class="controls">
                <button id="go-to-scheduler" style="padding: 14px 28px; font-size: 16px;">
                    Open Scheduler →
                </button>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 8px;">Database Status for <span id="db-school-label" style="color:var(--primary);">...</span></h3>
            <p style="font-size: 24px; font-weight: 700; color: var(--primary); margin: 0;">
                <span id="db-count">0</span> <span style="font-size: 16px; color: var(--text-muted); font-weight: 400;">Sections Loaded</span>
            </p>
            <div class="controls">
                <button id="clear-db-btn">Clear My School's Data</button>
            </div>
        </div>

        <div class="card">
            <h3>Upload Sections Report</h3>
            <p style="color: var(--text-muted); font-size: 14px;">Upload a fresh <strong>.csv</strong> to update your school's database.</p>
            <div class="controls" style="flex-direction: column;">
                <select id="school-select" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px; font-family: 'Inter', sans-serif; font-size: 14px; background-color: #f9fafb; cursor: not-allowed;">
                    <option value="" disabled selected>-- Select School --</option>
                    <option value="FXH">FXH</option>
                    <option value="ABC">ABC</option>
                </select>
                <input type="file" id="csv-file" accept=".csv" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px;">
                <button id="save-db-btn" style="display:none; background: var(--success);">Push to Database</button>
            </div>
            <div id="status-msg" style="margin-top: 16px; font-weight: 600;"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let parsedData = [];
    let currentUserSchool = null;

    async function checkUser() {
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
        
        if (!user || authError) {
            window.location.href = 'index.html';
            return;
        }

        const { data: allowedUser, error: dbError } = await supabaseClient
            .from('allowed_users')
            .select('*')
            .eq('email', user.email)
            .maybeSingle();

        if (allowedUser) {
            currentUserSchool = allowedUser.school;
            
            // UI Setup
            document.body.style.display = 'block'; // Reveal page only now
            document.getElementById('user-name').textContent = user.user_metadata.full_name || user.email;
            document.getElementById('db-school-label').textContent = currentUserSchool;
            
            // Lock the school dropdown to authorized school
            const select = document.getElementById('school-select');
            select.value = currentUserSchool;
            select.disabled = true;

            fetchCount();
        } else {
            alert("Your account is not authorized.");
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }
    }

    async function fetchCount() {
        if (!currentUserSchool) return;
        const { count } = await supabaseClient
            .from('sections')
            .select('*', { count: 'exact', head: true })
            .eq('school', currentUserSchool);
        document.getElementById('db-count').textContent = count || 0;
    }

    document.getElementById('logout-btn').onclick = async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    };

    document.getElementById('go-to-scheduler').onclick = () => window.location.href = 'scheduler.html';

    // CSV LOGIC
    document.getElementById('csv-file').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
            const lines = event.target.result.split(/\r?\n/);
            const headers = lines[0].split(regex).map(h => h.replace(/"/g, '').trim());
            parsedData = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cells = lines[i].split(regex).map(c => c.replace(/"/g, '').trim());
                let rowObj = {};
                headers.forEach((h, idx) => rowObj[h] = cells[idx]);
                parsedData.push(rowObj);
            }
            document.getElementById('save-db-btn').style.display = 'block';
            document.getElementById('status-msg').textContent = `📊 Prepared ${parsedData.length} sections for upload.`;
            document.getElementById('status-msg').style.color = "var(--text-main)";
        };
        reader.readAsText(file);
    };

    document.getElementById('save-db-btn').onclick = async () => {
        const msg = document.getElementById('status-msg');
        const btn = document.getElementById('save-db-btn');
        
        msg.textContent = "⏳ Uploading in chunks...";
        msg.style.color = "var(--text-main)";
        btn.disabled = true; 
        btn.style.opacity = "0.5";
        
        const dataToUpload = parsedData.map(row => {
            // Split Course-Section (e.g., "ADA1OR-1") into separate fields
            const courseSection = (row["Course-Section"] || "").trim();
            const hyphenIdx = courseSection.indexOf('-');
            let course = courseSection;
            let section = "";
            if (hyphenIdx !== -1) {
                course = courseSection.substring(0, hyphenIdx).trim();
                section = courseSection.substring(hyphenIdx + 1).trim();
            }
            
            const teacher = (row["Teacher Name"] || "").trim();
            const term = (row["Term"] || "").trim();
            const period = (row["Period"] || "").trim();

            return {
                school: currentUserSchool,
                course_name: row["Course Name"] || null,
                course: course,
                section: section,
                term: term,
                period: period,
                homeroom: row["Homeroom"] || null,
                student_program: row["Student Program"] || null,
                onsis_class_code: row["OnSIS Class Code"] || null,
                credit_recovery: row["Other Course Info Credit Recovery"] || null,
                ministry_content: row["Other Course Info Ministry Content"] || null,
                combined: row["Combined"] || null,
                grade_level: row["Grade Level"] || null,
                class_type: row["Class Type"] || null,
                delivery_type: row["Delivery Type"] || null,
                language_of_instruction: row["Language of Instruction"] || null,
                course_lang_program_type: row["Course Language Program Type"] || null,
                section_lang_program_type: row["Section Language Program Type"] || null,
                section_type: row["Section Type"] || null,
                max_enrollment: row["Max Enrollment"] || null,
                student_count: row["#Students"] || null,
                room: row["Room"] || null,
                teacher_name: teacher,
                teacher_email: row["Teacher Email"] || null,
                orig_teacher: teacher,
                orig_term: term,
                orig_period: period
            };
        });

        const chunkSize = 100;
        let totalInserted = 0;
        let hasError = false;

        for (let i = 0; i < dataToUpload.length; i += chunkSize) {
            const chunk = dataToUpload.slice(i, i + chunkSize);
            const { error } = await supabaseClient.from('sections').insert(chunk);
            
            if (error) {
                hasError = true;
                msg.textContent = `❌ Database Error: ` + error.message; 
                msg.style.color = "var(--danger)";
                break;
            }
            totalInserted += chunk.length;
            msg.textContent = `⏳ Uploaded ${totalInserted} / ${dataToUpload.length} sections...`;
        }
        
        btn.disabled = false;
        btn.style.opacity = "1";

        if (!hasError) { 
            msg.textContent = `✅ Success! All ${dataToUpload.length} sections safely pushed.`; 
            msg.style.color = "var(--success)";
            btn.style.display = 'none';
            fetchCount(); 
        }
    };

    document.getElementById('clear-db-btn').onclick = async () => {
        if(confirm(`⚠️ Delete all data for ${currentUserSchool}?`)) {
            await supabaseClient.from('sections').delete().eq('school', currentUserSchool);
            fetchCount();
        }
    };

    checkUser();
</script>
</body>
</html>
