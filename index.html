<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xzfseofviwlifygfkhdp.supabase.co https://*.supabase.co;">
    <title>HS Scheduler - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card" style="max-width: 400px; margin: 100px auto; padding: 40px 20px;">
        <h1 style="color: var(--primary); margin-bottom: 10px;">HS Scheduler</h1>
        <p style="color: var(--text-muted); margin-bottom: 24px;">Sign in to access the master sandbox.</p>
        <button id="login-btn" style="width: 100%; padding: 12px;">Sign in with Google</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // If user is already logged in, send them straight to the dashboard
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
            window.location.href = 'dashboard.html';
        }
    });

    document.getElementById('login-btn').onclick = async () => {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        // Check if we are on GitHub and append the folder name
        const redirectUrl = isLocal 
            ? window.location.origin + '/dashboard.html' 
            : 'https://andrewkwai.github.io/hs-scheduler/dashboard.html';

        await supabaseClient.auth.signInWithOAuth({ 
            provider: 'google', 
            options: { 
                redirectTo: redirectUrl
            } 
        });
    };
</script>
</body>
</html>
