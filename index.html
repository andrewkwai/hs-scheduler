<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Scheduler - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card" style="max-width: 400px; margin: 100px auto; padding: 40px 20px;">
        <h1 style="color: var(--primary); margin-bottom: 10px;">HS Scheduler</h1>
        <p style="color: var(--text-muted); margin-bottom: 24px;">Sign in to access the master sandbox.</p>
        <button id="login-btn" style="width: 100%; padding: 12px;">Sign in with Google</button>
    </div>

    <div id="app-section" style="display:none;">
        <div class="header-flex">
            <h1>Welcome, <span id="user-name">VP</span> 👋</h1>
            <button id="logout-btn">Sign Out</button>
        </div>
        
        <div class="card highlight">
            <h2 style="color: var(--primary);">Master Grid Visualizer</h2>
            <p style="color: var(--text-muted);">Ready to build? Move to the visual drag-and-drop board.</p>
            <div class="controls">
                <button id="go-to-scheduler" style="padding: 14px 28px; font-size: 16px;">
                    Open Scheduler →
                </button>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 8px;">Database Status for <span id="db-school-label" style="color:var(--primary);">...</span></h3>
            <p style="font-size: 24px; font-weight: 700; color: var(--primary); margin: 0;">
                <span id="db-count">0</span> <span style="font-size: 16px; color: var(--text-muted); font-weight: 400;">Sections Loaded</span>
            </p>
            <div class="controls">
                <button id="refresh-db-btn">Refresh</button>
                <button id="clear-db-btn">Clear My School's Data</button>
            </div>
        </div>

        <div class="card">
            <h3>Upload Sections Report</h3>
            <p style="color: var(--text-muted); font-size: 14px;">Select the target school and upload a fresh <strong>.csv</strong> to update the database.</p>
            <div class="controls" style="flex-direction: column;">
                
                <select id="school-select" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px; font-family: 'Inter', sans-serif; font-size: 14px;">
                    <option value="" disabled selected>-- Select School --</option>
                    <option value="FXH">FXH</option>
                    <option value="PIH">PIH</option>
                </select>

                <input type="file" id="csv-file" accept=".csv" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px;">
                <button id="save-db-btn">Push to Database</button>
            </div>
            <div id="status-msg" style="margin-top: 16px; font-weight: 600;"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let parsedData = [];
    let currentUserSchool = null; // Store the user's assigned school

    document.getElementById('login-btn').onclick = async () => {
        await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
    };

    document.getElementById('logout-btn').onclick = async () => {
        await supabaseClient.auth.signOut();
        window.location.reload();
    };

    document.getElementById('go-to-scheduler').onclick = () => window.location.href = 'scheduler.html';
    document.getElementById('refresh-db-btn').onclick = fetchCount;

    async function checkUser() {
        // 1. Get the user from the current session
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
        
        if (authError) {
            console.error("Auth Error:", authError.message);
            return;
        }

        if (user) {
            console.log("Logged in as:", user.email);

            // 2. Query the allowed_users table
            const { data: allowedUser, error: dbError } = await supabaseClient
                .from('allowed_users')
                .select('*')
                .eq('email', user.email)
                .maybeSingle(); // maybeSingle returns null instead of an error if not found

            if (dbError) {
                console.error("Database Query Error:", dbError.message);
                // This usually triggers if RLS is blocking you
                alert("Security Error: " + dbError.message);
                return;
            }

            if (allowedUser) {
                console.log("Authorization Success! School:", allowedUser.school);
                
                currentUserSchool = allowedUser.school;
                
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('app-section').style.display = 'block';
                document.getElementById('user-name').textContent = `${user.user_metadata.full_name} (${currentUserSchool})`;
                document.getElementById('user-name').textContent = (user.user_metadata.full_name || 'User') + " (" + currentUserSchool + ")";
                document.getElementById('db-school-label').textContent = currentUserSchool;
                
                const schoolSelect = document.getElementById('school-select');
                if (Array.from(schoolSelect.options).some(opt => opt.value === currentUserSchool)) {
                    schoolSelect.value = currentUserSchool;
                }

                fetchCount();
            } else {
                // 3. User is logged into Google but NOT in your allowed_users table
                console.warn("User not found in allowed_users table.");
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('auth-section').innerHTML = `
                    <div style="border: 2px solid var(--danger); padding: 20px; border-radius: 12px;">
                        <h2 style="color: var(--danger); margin-top: 0;">Access Denied</h2>
                        <p style="color: var(--text-muted);">The account <strong>${user.email}</strong> is not on the authorized list for this system.</p>
                        <p style="font-size: 12px; color: var(--text-muted);"><em>Note: Database lookup returned no matches.</em></p>
                        <button onclick="supabaseClient.auth.signOut().then(() => window.location.reload())" style="background: var(--danger); width: 100%; margin-top: 10px;">Sign Out & Try Another Account</button>
                    </div>
                `;
                document.getElementById('app-section').style.display = 'none';
            }
        } else {
            // No one is logged in
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }
    }

    async function fetchCount() {
        if (!currentUserSchool) return;
        // ONLY count sections that match the user's assigned school
        const { count } = await supabaseClient
            .from('sections')
            .select('*', { count: 'exact', head: true })
            .eq('school', currentUserSchool);
        
        document.getElementById('db-count').textContent = count || 0;
    }

    document.getElementById('csv-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
            const lines = event.target.result.split(/\r?\n/);
            const headers = lines[0].split(regex).map(h => h.replace(/"/g, '').trim());
            parsedData = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cells = lines[i].split(regex).map(c => c.replace(/"/g, '').trim());
                let rowObj = {};
                headers.forEach((h, idx) => rowObj[h] = cells[idx]);
                parsedData.push(rowObj);
            }
            document.getElementById('save-db-btn').style.display = 'block';
        };
        reader.readAsText(file);
    });

    document.getElementById('save-db-btn').onclick = async () => {
        const selectedSchool = document.getElementById('school-select').value;
        const msg = document.getElementById('status-msg');

        if (!selectedSchool) {
            msg.textContent = "❌ Please select a school from the dropdown first.";
            msg.style.color = "var(--danger)";
            return;
        }

        msg.textContent = "⏳ Uploading to Supabase...";
        msg.style.color = "#4f46e5";
        
        // Append the selected school to EVERY row before uploading
        // SECURITY: Ensure the selected school matches the user's authorized school
        if (selectedSchool !== currentUserSchool) {
            msg.textContent = "❌ Security Error: You are not authorized to upload data for " + selectedSchool;
            msg.style.color = "var(--danger)";
            return;
        }

        const dataToUpload = parsedData.map(row => ({
            ...row,
            school: selectedSchool
            school: currentUserSchool // Use the verified school from checkUser()
        }));

        const { error } = await supabaseClient.from('sections').insert(dataToUpload);
        if (error) { 
            msg.textContent = "❌ Error: " + error.message; 
            msg.style.color = "var(--danger)"; 
        } else { 
            msg.textContent = `✅ Success! Data pushed to ${selectedSchool}.`; 
            msg.style.color = "var(--success)";
            document.getElementById('save-db-btn').style.display = 'none';
            fetchCount(); 
        }
    };

    document.getElementById('clear-db-btn').onclick = async () => {
        if (!currentUserSchool) return;
        
        if(confirm(`⚠️ WARNING: This will delete ALL sections for ${currentUserSchool}. It will not affect other schools. Proceed?`)) {
            // SECURITY: Only delete where school = user's school
            await supabaseClient.from('sections').delete().eq('school', currentUserSchool);
            fetchCount();
        }
    };

    checkUser();
</script>
</body>
</html>
