<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xzfseofviwlifygfkhdp.supabase.co https://*.supabase.co;">
    <title>HS Scheduler - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card" style="max-width: 400px; margin: 100px auto; padding: 40px 20px;">
        <h1 style="color: var(--primary); margin-bottom: 10px;">HS Scheduler</h1>
        <!--<p id="auth-status" style="color: var(--text-muted); margin-bottom: 24px;"></p>-->
        <button id="login-btn" style="width: 100%; padding: 12px;">Sign in with Google</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // THE BOUNCER LOGIC
    async function checkAccess() {
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session) {
            const user = session.user;
            const statusText = document.getElementById('auth-status');
            statusText.textContent = "Checking authorization...";

            // Validate against your allowed_users table
            const { data: allowedUser, error } = await supabaseClient
                .from('allowed_users')
                .select('*')
                .eq('email', user.email)
                .maybeSingle();

            if (allowedUser) {
                // SUCCESS: Proceed to dashboard
                window.location.href = 'dashboard.html';
            } else {
                // FAILURE: Unauthorized email
                statusText.textContent = "❌ Access Denied: Your account is not authorized.";
                statusText.style.color = "var(--danger)";
                
                // Sign them out so they don't get stuck in a loop
                await supabaseClient.auth.signOut();
            }
        }
    }

    // Run every time the page loads/auth state changes
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) checkAccess();
    });

    document.getElementById('login-btn').onclick = async () => {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        // IMPORTANT: We redirect back to INDEX now, not Dashboard.
        // This ensures the bouncer check runs before the user ever sees the app.
        const redirectUrl = isLocal 
            ? window.location.origin + '/index.html' 
            : 'https://andrewkwai.github.io/hs-scheduler/index.html';

        await supabaseClient.auth.signInWithOAuth({ 
            provider: 'google', 
            options: { 
                redirectTo: redirectUrl
            } 
        });
    };

    // Initial check on load
    checkAccess();
</script>
</body>
</html>
