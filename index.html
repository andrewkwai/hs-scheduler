<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Scheduler - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div id="auth-section">
        <h1>HS Scheduler</h1>
        <p>Please sign in to access the Master Schedule Sandbox.</p>
        <button id="login-btn">Sign in with Google</button>
    </div>

    <div id="app-section" style="display:none;">
        <div class="header-flex">
            <h1>Welcome, <span id="user-name">VP</span>!</h1>
            <button id="logout-btn">Sign Out</button>
        </div>
        
        <div class="card" style="background: #f3e5f5; border: 2px solid #7b1fa2;">
            <h2 style="color: #7b1fa2; margin-top: 0;">Ready to Schedule?</h2>
            <p>Move from data management to the visual master grid.</p>
            <button id="go-to-scheduler" style="background: #6200ee; color:white; padding: 15px 30px; font-size: 18px;">
                Open Visual Scheduler →
            </button>
        </div>
        
        <div class="card status-card">
            <h3>Database Status: <span id="db-count">0</span> Sections Loaded</h3>
            <div class="controls">
                <button id="refresh-db-btn" style="background: #6c757d; color:white;">Refresh View</button>
                <button id="clear-db-btn" style="background: #dc3545; color:white;">Clear All Data</button>
            </div>
        </div>

        <div class="card">
            <p>Upload a new <strong>Sections.csv</strong> to update the database:</p>
            <div class="controls">
                <input type="file" id="csv-file" accept=".csv">
                <button id="save-db-btn">Upload Sections Report</button>
            </div>
            <div id="status-msg"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let parsedData = [];

    // --- BUTTON CLICKS ---
    document.getElementById('login-btn').onclick = async () => {
        await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + window.location.pathname }
        });
    };

    document.getElementById('logout-btn').onclick = async () => {
        await supabaseClient.auth.signOut();
        window.location.reload();
    };

    // NAVIGATE TO SCHEDULER
    document.getElementById('go-to-scheduler').onclick = () => {
        window.location.href = 'scheduler.html';
    };

    // --- AUTH LOGIC ---
    async function checkUser() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
            // Logged In: Show the Dashboard
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('user-name').textContent = user.user_metadata.full_name;
            fetchCount();
        } else {
            // Not Logged In: Show only Login
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }
    }

    async function fetchCount() {
        const { count } = await supabaseClient.from('sections').select('*', { count: 'exact', head: true });
        document.getElementById('db-count').textContent = count || 0;
    }

    // --- CSV LOGIC ---
    document.getElementById('csv-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
            const lines = event.target.result.split(/\r?\n/);
            const headers = lines[0].split(regex).map(h => h.replace(/"/g, '').trim());
            parsedData = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cells = lines[i].split(regex).map(c => c.replace(/"/g, '').trim());
                let rowObj = {};
                headers.forEach((h, idx) => rowObj[h] = cells[idx]);
                parsedData.push(rowObj);
            }
            document.getElementById('save-db-btn').style.display = 'inline-block';
        };
        reader.readAsText(file);
    });

    document.getElementById('save-db-btn').onclick = async () => {
        const msg = document.getElementById('status-msg');
        msg.textContent = "Uploading...";
        const { error } = await supabaseClient.from('sections').insert(parsedData);
        if (error) { msg.textContent = "Error: " + error.message; msg.style.color="red"; }
        else { msg.textContent = "Success!"; fetchCount(); }
    };

    document.getElementById('clear-db-btn').onclick = async () => {
        if(confirm("Delete everything?")) {
            await supabaseClient.from('sections').delete().neq('id', 0);
            fetchCount();
        }
    };

    checkUser();
</script>
</body>
</html>
