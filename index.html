<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xzfseofviwlifygfkhdp.supabase.co https://*.supabase.co;">
    <title>HS Scheduler - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card" style="max-width: 400px; margin: 100px auto; padding: 40px 20px;">
        <h1 style="color: var(--primary); margin-bottom: 10px;">HS Scheduler</h1>
        <p id="auth-status" style="color: var(--text-muted); margin-bottom: 24px; min-height: 1.2em;"></p>
        <button id="login-btn" class="google-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            <span>Sign in with Google</span>
        </button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // THE BOUNCER LOGIC
    async function checkAccess() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const statusText = document.getElementById('auth-status');

        if (session) {
            const user = session.user;
            if (statusText) statusText.textContent = "Checking authorization...";

            // Validate against your allowed_users table
            const { data: allowedUser, error } = await supabaseClient
                .from('allowed_users')
                .select('*')
                .eq('email', user.email)
                .maybeSingle();

            if (allowedUser) {
                // SUCCESS: Proceed to dashboard
                window.location.href = 'dashboard.html';
            } else {
                // FAILURE: Unauthorized email
                if (statusText) {
                    statusText.textContent = "❌ Access Denied: Your account is not authorized.";
                    statusText.style.color = "var(--danger)";
                }
                
                // Sign them out so they don't get stuck in a loop
                await supabaseClient.auth.signOut();
            }
        }
    }

    // Run every time the page loads/auth state changes
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) checkAccess();
    });

    document.getElementById('login-btn').onclick = async () => {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        // IMPORTANT: We redirect back to INDEX now, not Dashboard.
        // This ensures the bouncer check runs before the user ever sees the app.
        const redirectUrl = isLocal 
            ? window.location.origin + '/index.html' 
            : 'https://andrewkwai.github.io/hs-scheduler/index.html';

        await supabaseClient.auth.signInWithOAuth({ 
            provider: 'google', 
            options: { 
                redirectTo: redirectUrl
            } 
        });
    };

    // Initial check on load
    checkAccess();
</script>
</body>
</html>
