<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xzfseofviwlifygfkhdp.supabase.co https://*.supabase.co;">
    <title>Master Grid - HS Scheduler</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div class="controls-bar">
    <a href="index.html" style="color: #9ca3af; text-decoration: none; font-size: 14px; font-weight: 500;">← Dashboard</a>
    <strong style="font-size: 18px; margin-left: 15px;">Master Grid <span id="school-label" style="color: #818cf8; margin-left: 8px;"></span></strong>
    
    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; margin-left: 20px; cursor: pointer;">
        <input type="checkbox" id="lock-rows" checked style="cursor: pointer; width: 16px; height: 16px;"> 
        Constrain to Period
    </label>

    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; margin-left: 20px; cursor: pointer;">
        <input type="checkbox" id="group-by-subject" style="cursor: pointer; width: 16px; height: 16px;"> 
        Group by Subject
    </label>
    
    <button id="view-changes-btn" style="margin-left: 20px; background: #059669; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">
        📋 View Changes
    </button>
    
    <div style="flex-grow: 1;"></div>
    <span id="save-status" class="save-indicator">● Cloud Sync Active</span>
</div>

<div class="grid-container">
    <table id="master-grid">
        <thead><tr id="teacher-headers"></tr></thead>
        <tbody id="grid-body"></tbody>
    </table>
</div>

<div id="changes-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 80%; max-width: 900px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 15px;">
            <h2 style="margin: 0; color: #1e293b;">Proposed Schedule Changes</h2>
            <div style="display: flex; gap: 10px;">
                <button id="export-pdf-btn" style="background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Export PDF</button>
                <button id="close-modal-btn" style="background: #f1f5f9; color: #333; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Close</button>
            </div>
        </div>
        
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
            <thead>
                <tr style="background: #f8fafc; border-bottom: 2px solid #cbd5e1;">
                    <th style="padding: 12px; border: none;">Course</th>
                    <th style="padding: 12px; border: none;">Original (PowerSchool)</th>
                    <th style="padding: 12px; border: none;">New Assignment</th>
                </tr>
            </thead>
            <tbody id="changes-tbody">
                </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allSections = [];
    let teachers = [];
    let lockedTeachers = new Set();
    let currentUserSchool = null;
    let subjectLookup = {}; // Prefix -> Subject Area mapping

    // Color Palette for Ontario Subject Areas
    const subjectColors = {
        "English": "#3b82f6",              // Blue
        "Mathematics": "#ef4444",          // Red
        "Science": "#22c55e",              // Green
        "The Arts": "#a855f7",              // Purple
        "Business Studies": "#f59e0b",      // Amber
        "Canadian and World Studies": "#14b8a6", // Teal
        "Health and Physical Education": "#f97316", // Orange
        "Social Sciences and Humanities": "#ec4899", // Pink
        "Technological Education": "#64748b", // Slate
        "French as a Second Language": "#06b6d4", // Cyan
        "International Languages": "#06b6d4", // Cyan
        "Guidance and Career Education": "#84cc16", // Lime
        "Interdisciplinary Studies": "#6366f1", // Indigo
        "First Nations, Métis, and Inuit Studies": "#8b5cf6" // Violet
    };

    const periods = [
        {term: 'S1', per: '1(A)'}, {term: 'S1', per: '2(A)'}, {term: 'S1', per: '3(A)'}, {term: 'S1', per: '4(A)'},
        {term: 'S2', per: '1(A)'}, {term: 'S2', per: '2(A)'}, {term: 'S2', per: '3(A)'}, {term: 'S2', per: '4(A)'}
    ];

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'index.html'; return; }

        const { data: allowedUser } = await supabaseClient
            .from('allowed_users')
            .select('*')
            .eq('email', user.email)
            .single();

        if (!allowedUser || !allowedUser.school) {
            alert("Unauthorized access or missing school assignment.");
            window.location.href = 'index.html';
            return;
        }

        currentUserSchool = allowedUser.school;
        document.getElementById('school-label').textContent = `[${currentUserSchool}]`;

        // NEW: Fetch the Subject/Prefix map from your new table
        const { data: subData, error: subError } = await supabaseClient.from('course_subjects').select('course_prefix, subject_area');
        if (subError) {
            console.error("Error fetching course_subjects mapping:", subError.message);
        } else if (subData) {
            subData.forEach(row => {
                if (row.course_prefix) subjectLookup[row.course_prefix.trim()] = row.subject_area;
            });
        }

        // Fetch sections
        const { data } = await supabaseClient
            .from('sections')
            .select('*')
            .eq('school', currentUserSchool);
            
        allSections = data || [];
        sortTeachers();
        renderGrid();
    }

    document.getElementById('group-by-subject').onchange = () => {
        sortTeachers();
        renderGrid();
    };

    function getTeacherSubject(teacherName) {
        const teacherSections = allSections.filter(s => s.Teacher === teacherName);
        if (teacherSections.length === 0) return "Other";
        const subjectCounts = {};
        teacherSections.forEach(s => {
            const prefix = s.Course ? s.Course.trim().substring(0, 3) : "";
            const subject = subjectLookup[prefix] || "Other";
            subjectCounts[subject] = (subjectCounts[subject] || 0) + 1;
        });
        // Returns the subject the teacher teaches most often
        return Object.keys(subjectCounts).reduce((a, b) => subjectCounts[a] > subjectCounts[b] ? a : b);
    }

    function sortTeachers() {
        const groupBySubject = document.getElementById('group-by-subject').checked;
        const baseTeachers = [...new Set(allSections.map(s => s.Teacher))].filter(t => t);
        if (groupBySubject) {
            teachers = baseTeachers.sort((a, b) => {
                const subA = getTeacherSubject(a);
                const subB = getTeacherSubject(b);
                return subA.localeCompare(subB) || a.localeCompare(b);
            });
        } else {
            teachers = baseTeachers.sort();
        }
    }

    function renderGrid() {
        const head = document.getElementById('teacher-headers');
        const body = document.getElementById('grid-body');
        
        head.innerHTML = '<th class="period-header">Period</th>';
        teachers.forEach(t => {
            const th = document.createElement('th');
            th.className = 'teacher-header';
            
            let displayName = t;
            if (t.includes(',')) {
                const parts = t.split(',');
                displayName = `${parts[0].trim()}, ${parts[1].trim()}`;
            }

            const nameDiv = document.createElement('div');
            nameDiv.style.marginBottom = "4px";
            nameDiv.textContent = displayName;
            th.appendChild(nameDiv);

            if (document.getElementById('group-by-subject').checked) {
                const sub = getTeacherSubject(t);
                const subDiv = document.createElement('div');
                subDiv.style.fontSize = "9px";
                subDiv.style.color = subjectColors[sub] || "#64748b";
                subDiv.style.fontWeight = "700";
                subDiv.style.marginBottom = "6px";
                subDiv.textContent = sub;
                th.appendChild(subDiv);
            }

            th.insertAdjacentHTML('beforeend', `
                <label style="font-size: 11px; color: #6b7280; font-weight: 400; display:flex; align-items:center; justify-content:center; gap:4px; cursor:pointer;">
                    <input type="checkbox" onchange="toggleLock('${t}', this.checked)" ${lockedTeachers.has(t) ? 'checked' : ''}> Lock
                </label>
            `);
            
            if(lockedTeachers.has(t)) th.style.background = '#fee2e2'; 
            head.appendChild(th);
        });

        body.innerHTML = '';
        periods.forEach(p => {
            const tr = document.createElement('tr');
            const tdLabel = document.createElement('td');
            tdLabel.className = 'period-header';
            tdLabel.innerHTML = `${p.term}<br><span style="font-size:11px; color:#9ca3af; font-weight:400;">Per ${p.per}</span>`;
            
            const resizer = document.createElement('div');
            resizer.className = 'row-resizer';
            tdLabel.appendChild(resizer);

            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                const startY = e.clientY;
                const startHeight = tdLabel.offsetHeight;
                resizer.classList.add('active');

                function onMouseMove(e) {
                    const newHeight = Math.max(80, startHeight + (e.clientY - startY)); 
                    Array.from(tr.children).forEach(cell => {
                        cell.style.setProperty('height', newHeight + 'px', 'important');
                        cell.style.setProperty('max-height', newHeight + 'px', 'important');
                    });
                }

                function onMouseUp() {
                    resizer.classList.remove('active');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            tr.appendChild(tdLabel);

            teachers.forEach(t => {
                const td = document.createElement('td');
                td.dataset.teacher = t; td.dataset.term = p.term; td.dataset.period = p.per;
                
                if(lockedTeachers.has(t)) td.style.background = '#fafafa';

                const scrollWrapper = document.createElement('div');
                scrollWrapper.className = 'cell-scroll-wrapper';
                
                td.ondragover = e => e.preventDefault();
                td.ondragenter = () => { if(!lockedTeachers.has(t)) td.classList.add('drop-target'); };
                td.ondragleave = () => td.classList.remove('drop-target');
                td.ondrop = handleDrop;

                allSections.filter(s => s.Teacher === t && s.Term === p.term && s.Period === p.per)
                    .forEach(s => {
                        const card = document.createElement('div');
                        card.className = 'course-card';
                        card.draggable = !lockedTeachers.has(t);
                        if(lockedTeachers.has(t)) card.style.cursor = 'not-allowed';
                        
                        // NEW: Color Coding Logic
                        const prefix = s.Course ? s.Course.trim().substring(0, 3) : "";
                        const subject = subjectLookup[prefix] || "Other";
                        const borderCol = subjectColors[subject] || "#94a3b8"; // Default slate
                        card.style.borderLeft = `4px solid ${borderCol}`;

                        card.innerHTML = `<strong>${s.Course}-${s.Section || ''}</strong><span>${s.CrsName}</span>`;
                        
                        card.ondragstart = e => { 
                            e.dataTransfer.setData('sectionId', s.id); 
                            card.classList.add('dragging'); 
                        };
                        card.ondragend = () => card.classList.remove('dragging');
                        
                        scrollWrapper.appendChild(card);
                    });
                
                td.appendChild(scrollWrapper);
                tr.appendChild(td);
            });
            body.appendChild(tr);
        });
    }

    function toggleLock(t, isLocked) {
        if(isLocked) lockedTeachers.add(t); else lockedTeachers.delete(t);
        renderGrid();
    }

    async function handleDrop(e) {
        e.preventDefault();
        const td = e.currentTarget;
        td.classList.remove('drop-target');
        const id = e.dataTransfer.getData('sectionId');
        if (!id) return;
        const source = allSections.find(s => s.id == id);

        if(lockedTeachers.has(td.dataset.teacher)) return alert("Teacher Locked");
        if(document.getElementById('lock-rows').checked && source.Period !== td.dataset.period) {
            alert("Constrain Active: Cannot switch periods.");
            return;
        }

        document.getElementById('save-status').textContent = "⏳ Syncing...";
        document.getElementById('save-status').style.color = "#fbbf24";

        const { data, error } = await supabaseClient
            .from('sections')
            .update({ 
                Teacher: td.dataset.teacher, 
                Term: td.dataset.term, 
                Period: td.dataset.period 
            })
            .eq('id', id)
            .eq('school', currentUserSchool) 
            .select(); 

        if(!error && data && data.length > 0) { 
            document.getElementById('save-status').textContent = "✅ Saved"; 
            document.getElementById('save-status').style.color = "#34d399"; 
            const index = allSections.findIndex(s => s.id == id);
            allSections[index] = data[0]; 
            renderGrid(); 
        } else {
            console.error("Save Error:", error);
            alert("Error saving: " + (error ? error.message : "Row visibility lost"));
            document.getElementById('save-status').textContent = "❌ Error";
            renderGrid(); 
        }
    }

    document.getElementById('view-changes-btn').onclick = () => {
        const tbody = document.getElementById('changes-tbody');
        tbody.innerHTML = ''; 
        const changedSections = allSections.filter(s => {
            return s.Teacher !== s.orig_teacher || 
                   String(s.Term) !== String(s.orig_term) || 
                   String(s.Period) !== String(s.orig_period);
        });

        if (changedSections.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 30px; color: #64748b;">No changes detected.</td></tr>`;
        } else {
            changedSections.forEach(s => {
                const origStr = `${s.orig_teacher} | Term: ${s.orig_term} | Per: ${s.orig_period}`;
                const newStr = `${s.Teacher} | Term: ${s.Term} | Per: ${s.Period}`;
                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 12px; border: none;">
                            <strong>${s.Course}-${s.Section || ''}</strong><br>
                            <span style="font-size: 12px; color: #64748b;">${s.CrsName}</span>
                        </td>
                        <td style="padding: 12px; border: none; color: #dc2626;">
                            <del>${origStr}</del>
                        </td>
                        <td style="padding: 12px; border: none; color: #059669; font-weight: 600;">
                            ${newStr}
                        </td>
                    </tr>`;
            });
        }
        document.getElementById('changes-modal').style.display = 'flex';
    };

    document.getElementById('close-modal-btn').onclick = () => {
        document.getElementById('changes-modal').style.display = 'none';
    };

    document.getElementById('export-pdf-btn').onclick = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const changedSections = allSections.filter(s => {
            return s.Teacher !== s.orig_teacher || 
                   String(s.Term) !== String(s.orig_term) || 
                   String(s.Period) !== String(s.orig_period);
        });

        const tableData = changedSections.map(s => [
            `${s.Course}-${s.Section || ''}\n${s.CrsName}`,
            `${s.orig_teacher}\nTerm: ${s.orig_term} | Per: ${s.orig_period}`,
            `${s.Teacher}\nTerm: ${s.Term} | Per: ${s.Period}`
        ]);

        doc.setFontSize(18);
        doc.text(`Schedule Changes: ${currentUserSchool}`, 14, 20);
        doc.setFontSize(11);
        doc.setTextColor(100);
        doc.text(`Generated on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}`, 14, 28);

        doc.autoTable({
            startY: 35,
            head: [['Course', 'Original (PowerSchool)', 'New Assignment']],
            body: tableData,
            headStyles: { fillColor: [79, 70, 229] },
            styles: { fontSize: 9, cellPadding: 3 },
            columnStyles: { 0: { cellWidth: 40 }, 1: { cellWidth: 70 }, 2: { cellWidth: 70 } }
        });

        doc.save(`Proposed_Changes_${currentUserSchool}.pdf`);
    };

    document.getElementById('changes-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('changes-modal')) {
            document.getElementById('changes-modal').style.display = 'none';
        }
    });

    init();
</script>
</body>
</html>
