<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xzfseofviwlifygfkhdp.supabase.co https://*.supabase.co;">
    <title>Master Grid - HS Scheduler</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="controls-bar">
    <a href="index.html" style="color: #9ca3af; text-decoration: none; font-size: 14px; font-weight: 500;">← Dashboard</a>
    <strong style="font-size: 18px;">Master Grid <span id="school-label" style="color: #818cf8; margin-left: 8px;"></span></strong>
    
    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; margin-left: 20px; cursor: pointer;">
        <input type="checkbox" id="lock-rows" checked style="cursor: pointer; width: 16px; height: 16px;"> 
        Constrain to Period
    </label>
    
    <div style="flex-grow: 1;"></div>
    <span id="save-status" class="save-indicator">● Cloud Sync Active</span>
</div>

<div class="grid-container">
    <table id="master-grid">
        <thead><tr id="teacher-headers"></tr></thead>
        <tbody id="grid-body"></tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://xzfseofviwlifygfkhdp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SQ2VKEbyWqfShaw5EfypgQ_esez7tdt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allSections = [];
    let teachers = [];
    let lockedTeachers = new Set();
    let currentUserSchool = null;

    const periods = [
        {term: 'S1', per: '1(A)'}, {term: 'S1', per: '2(A)'}, {term: 'S1', per: '3(A)'}, {term: 'S1', per: '4(A)'},
        {term: 'S2', per: '1(A)'}, {term: 'S2', per: '2(A)'}, {term: 'S2', per: '3(A)'}, {term: 'S2', per: '4(A)'}
    ];

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'index.html'; return; }

        const { data: allowedUser } = await supabaseClient
            .from('allowed_users')
            .select('*')
            .eq('email', user.email)
            .single();

        if (!allowedUser || !allowedUser.school) {
            alert("Unauthorized access or missing school assignment.");
            window.location.href = 'index.html';
            return;
        }

        currentUserSchool = allowedUser.school;
        document.getElementById('school-label').textContent = `[${currentUserSchool}]`;

        // SECURITY: Fetch ONLY sections belonging to this user's school
        const { data } = await supabaseClient
            .from('sections')
            .select('*')
            .eq('school', currentUserSchool);
            
        allSections = data || [];
        teachers = [...new Set(allSections.map(s => s.Teacher))].filter(t => t).sort();
        renderGrid();
    }

    function renderGrid() {
        const head = document.getElementById('teacher-headers');
        const body = document.getElementById('grid-body');
        
        head.innerHTML = '<th class="period-header">Period</th>';
        teachers.forEach(t => {
            const th = document.createElement('th');
            th.className = 'teacher-header';
            
            let displayName = t;
            if (t.includes(',')) {
                const parts = t.split(',');
                displayName = `${parts[0].trim()}, ${parts[1].trim()}`;
            }

            const nameDiv = document.createElement('div');
            nameDiv.style.marginBottom = "8px";
            nameDiv.textContent = displayName; // Safe text handling

            th.appendChild(nameDiv);
            th.insertAdjacentHTML('beforeend', `
                <label style="font-size: 11px; color: #6b7280; font-weight: 400; display:flex; align-items:center; justify-content:center; gap:4px; cursor:pointer;">
                    <input type="checkbox" onchange="toggleLock('${t}', this.checked)" ${lockedTeachers.has(t) ? 'checked' : ''}> Lock
                </label>
            `);
            
            if(lockedTeachers.has(t)) th.style.background = '#fee2e2'; 
            head.appendChild(th);
        });

        body.innerHTML = '';
        periods.forEach(p => {
            const tr = document.createElement('tr');
            
            const tdLabel = document.createElement('td');
            tdLabel.className = 'period-header';
            tdLabel.innerHTML = `${p.term}<br><span style="font-size:11px; color:#9ca3af; font-weight:400;">Per ${p.per}</span>`;
            
            const resizer = document.createElement('div');
            resizer.className = 'row-resizer';
            tdLabel.appendChild(resizer);

            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                const startY = e.clientY;
                const startHeight = tdLabel.offsetHeight;
                resizer.classList.add('active');

                function onMouseMove(e) {
                    const newHeight = Math.max(80, startHeight + (e.clientY - startY)); 
                    Array.from(tr.children).forEach(cell => {
                        cell.style.setProperty('height', newHeight + 'px', 'important');
                        cell.style.setProperty('max-height', newHeight + 'px', 'important');
                    });
                }

                function onMouseUp() {
                    resizer.classList.remove('active');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            tr.appendChild(tdLabel);

            teachers.forEach(t => {
                const td = document.createElement('td');
                td.dataset.teacher = t; td.dataset.term = p.term; td.dataset.period = p.per;
                
                if(lockedTeachers.has(t)) td.style.background = '#fafafa';

                const scrollWrapper = document.createElement('div');
                scrollWrapper.className = 'cell-scroll-wrapper';
                
                td.ondragover = e => e.preventDefault();
                td.ondragenter = () => { if(!lockedTeachers.has(t)) td.classList.add('drop-target'); };
                td.ondragleave = () => td.classList.remove('drop-target');
                td.ondrop = handleDrop;

                allSections.filter(s => s.Teacher === t && s.Term === p.term && s.Period === p.per)
                    .forEach(s => {
                        const card = document.createElement('div');
                        card.className = 'course-card';
                        card.draggable = !lockedTeachers.has(t);
                        if(lockedTeachers.has(t)) card.style.cursor = 'not-allowed';
                        
                        card.innerHTML = `<strong>${s.Course}</strong><span>${s.CrsName}</span>`;
                        
                        card.ondragstart = e => { 
                            e.dataTransfer.setData('sectionId', s.id); 
                            card.classList.add('dragging'); 
                        };
                        card.ondragend = () => card.classList.remove('dragging');
                        
                        scrollWrapper.appendChild(card);
                    });
                
                td.appendChild(scrollWrapper);
                tr.appendChild(td);
            });
            body.appendChild(tr);
        });
    }

    function toggleLock(t, isLocked) {
        if(isLocked) lockedTeachers.add(t); else lockedTeachers.delete(t);
        renderGrid();
    }

    async function handleDrop(e) {
        e.preventDefault();
        const td = e.currentTarget;
        td.classList.remove('drop-target');
        const id = e.dataTransfer.getData('sectionId');
        
        if (!id) return;
        
        const source = allSections.find(s => s.id == id);

        // 1. Validations
        if(lockedTeachers.has(td.dataset.teacher)) return alert("Teacher Locked");
        if(document.getElementById('lock-rows').checked && source.Period !== td.dataset.period) {
            alert("Constrain Active: Cannot switch periods.");
            return;
        }

        document.getElementById('save-status').textContent = "⏳ Syncing...";
        document.getElementById('save-status').style.color = "#fbbf24";

        // 2. The Update
        const { data, error } = await supabaseClient
            .from('sections')
            .update({ 
                Teacher: td.dataset.teacher, 
                Term: td.dataset.term, 
                Period: td.dataset.period 
            })
            .eq('id', id)
            .eq('school', currentUserSchool) // Safety: ensures you only edit your school
            .select(); // Critical: confirms the row still exists and is visible to you

        if(!error && data && data.length > 0) { 
            document.getElementById('save-status').textContent = "✅ Saved"; 
            document.getElementById('save-status').style.color = "#34d399"; 
            
            // Update local data without a full refresh to prevent "flicker"
            const index = allSections.findIndex(s => s.id == id);
            allSections[index] = data[0]; 
            renderGrid(); 
        } else {
            console.error("Save Error:", error);
            alert("Error saving: " + (error ? error.message : "Row visibility lost"));
            document.getElementById('save-status').textContent = "❌ Error";
            renderGrid(); // Put the card back where it was
        }
    }

    init();
</script>
</body>
</html>
